[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fit"
version = "0.1.0"
description = "AI Fit — agentic AWS Bedrock (Claude Opus) assistant for ALDO fit and occasion recommendations"
requires-python = ">=3.10"
dependencies = [
    # Bedrock Runtime client (Converse API with tool use). Pinned exactly.
    "boto3==1.35.99",
    # Property-based testing for the deterministic validator and pure helpers.
    "hypothesis==6.112.2",
    # Test runner.
    "pytest==8.3.3",
    # Web framework for the AI Fit Demo UI — serves the JSON API and the static
    # Demo_UI from a single process. The single documented web dependency, pinned
    # exactly (ai-fit-demo-ui Requirement 9.4). No front-end build toolchain.
    "Flask==3.0.3",
]

[tool.setuptools.packages.find]
include = ["ai_fit*", "ai_fit_demo_ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
